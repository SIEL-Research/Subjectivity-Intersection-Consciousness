name: Reproduce paper v1
on: [push, pull_request, workflow_dispatch]
jobs:
  numerical-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_manifest.py
      - run: python scripts/reproduce.py --output results/core
      - run: python scripts/reproduce_secondary.py --output results/secondary
      - run: python scripts/verify_records.py --output results/records
